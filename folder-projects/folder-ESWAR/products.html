<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Products — ESWAR</title>
<link rel="icon" type="image/png" href="logo.jpeg">
<style>
/* ✅ YOUR CORE STYLES — PRESERVED & ENHANCED FOR MOBILE MENU */
* { margin: 0; padding: 0; box-sizing: border-box; font-family: Poppins, Arial; }
body { background: #faf7f8; color: #222; }

.navbar {
  background: #000; color: #fff;
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 18px; position: fixed; top: 0; width: 100%; z-index: 1000;
}

.title-box { display: flex; align-items: center; gap: 10px; }
.logo-img { width: 46px; }
.logo { font-size: 18px; font-weight: 700; }

.desktop-menu { display: none; gap: 18px; }
.desktop-menu a { color: #fff; text-decoration: none; }

.hamburger {
  font-size: 28px;
  font-weight: 900;
  cursor: pointer;
  display: block;
}

/* ✅ MOBILE MENU: fixed visibility & animation */
.nav-links {
  position: fixed;
  top: 60px;
  left: -240px;
  width: 220px;
  height: calc(100vh - 60px);
  background: #111;
  display: flex;
  flex-direction: column;
  transition: left 0.35s ease;
  padding-top: 20px;
  z-index: 999;
}
.nav-links a {
  color: #fff;
  padding: 12px 20px;
  text-decoration: none;
  border-bottom: 1px solid #333;
}
.nav-links.show {
  left: 0;
}

.products {
  padding: 40px 20px;
  text-align: center;
  margin-top: 90px;
}

.section-title {
  text-align: center;
  margin: 25px 0;
  font-size: 22px;
}

.product-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 20px;
  max-width: 900px;
  margin: auto;
}

.product-card {
  background: #fff;
  border-radius: 14px;
  padding: 14px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.12);
}
.product-card img {
  width: 100%;
  height: 240px;
  object-fit: cover;
  border-radius: 10px;
  cursor: pointer;
}
.product-card h3 {
  margin: 12px 0 6px;
  font-size: 16px;
}
.product-card h5 {
  font-size: 14px;
  color: #666;
  margin: 0;
}

/* IMAGE PREVIEW OVERLAY */
#previewBox {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.9);
  z-index: 2000;
  cursor: pointer;
}
#previewImg {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  max-width: 90%;
  max-height: 90%;
  border-radius: 8px;
}

.footer {
  background: #000;
  color: #fff;
  text-align: center;
  padding: 14px 0;
  margin-top: 40px;
}

/* ✅ DESKTOP: menu on right, hamburger hidden */
@media (min-width: 768px) {
  .desktop-menu { display: flex; }
  .hamburger { display: none; }
  .nav-links { display: none !important; }
}
</style>
</head>

<body>

<header class="navbar">
  <div class="hamburger" onclick="toggleMenu()">☰</div>

  <div class="title-box">
    <img src="logo.jpeg" class="logo-img">
    <h1 class="logo">ESWAR COTTAGE INDUSTRIES</h1>
  </div>

  <nav class="desktop-menu">
    <a href="index.html">Home</a>
    <a href="products.html">Products</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </nav>

  <nav id="menu" class="nav-links">
    <a href="index.html">Home</a>
    <a href="products.html">Products</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>


<section class="products">
  <h2 class="section-title">Our Product Collection</h2>

  <div class="product-grid">
    <div class="product-card">
      <img src="10.jpg" onclick="openPreview(this.src)">
      <h3>சாம்பிராணி STAND</h3>
    </div>
    <div class="product-card">
      <img src="2.jpg" onclick="openPreview(this.src)">
      <h3>size: ALL SIZE</h3>
    </div>
    <div class="product-card">
      <img src="3.png" onclick="openPreview(this.src)">
      <h3>size: ALL SIZE</h3>
      <h5>[ With Tin]</h5>
    </div>
    <div class="product-card">
      <img src="5.jpg" onclick="openPreview(this.src)">
      <h3>size: ALL SIZE</h3>
    </div>
    <div class="product-card">
      <img src="9.jpg" onclick="openPreview(this.src)">
      <h3>size: ALL SIZE</h3>
    </div>
    <div class="product-card">
      <img src="4.jpg" onclick="openPreview(this.src)">
      <h3>size: ALL SIZE</h3>
    </div>
    <div class="product-card">
      <img src="img4.jpeg" onclick="openPreview(this.src)">
      <h3>size: ALL SIZE</h3>
    </div>
  </div>
</section>


<!-- IMAGE PREVIEW -->
<div id="previewBox" onclick="closePreview()">
  <img id="previewImg">
</div>

<footer class="footer">
  @ cottage-industry VIRUDHUNAGAR-626 001
</footer>

<!-- ✅ EMBEDDED JS: no external files needed -->
<script>
// Hamburger menu toggle
function toggleMenu() {
  document.getElementById('menu').classList.toggle('show');
}

// Image preview
function openPreview(src) {
  const box = document.getElementById('previewBox');
  const img = document.getElementById('previewImg');
  img.src = src;
  box.style.display = 'flex';
}

function closePreview() {
  document.getElementById('previewBox').style.display = 'none';
}
</script>

</body>
</html>
