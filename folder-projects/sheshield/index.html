<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SWF Women Safety</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>
<h2>🛡️ SWF</h2>
<p>Smart Women Safety Framework</p>
<h3>Be Bold. Face the Fear. Be Strong.</h3>
</header>

<div class="container">

<div class="card">

<button class="sos" onclick="activateSOS()">🚨 SOS ALERT</button>

<button onclick="getLocation()">📍 Detect Location</button>

<button onclick="shareLocation()">📩 Share Location</button>

<button onclick="findPolice()">🚓 Nearby Police</button>

<button onclick="callHelp()">☎ Emergency 112</button>

<button onclick="toggleDark()">🌙 Dark Mode</button>

</div>

<div class="card">
<h3>Live Map</h3>
<iframe id="mapFrame" width="100%" height="250"></iframe>
</div>

</div>

<div id="sosScreen">
<h1>🚨 HELP! 🚨</h1>
<p>Emergency Situation</p>
<button onclick="closeSOS()">Close</button>
</div>

<script src="script.js"></script>

</body>
</html>
